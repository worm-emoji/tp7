[package]
name = "tp7"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bytes = "1.5"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
futures = "0.3"
log = "0.4.29"
mtp-rs = "0.13.3"
nusb = "0.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9.0"
